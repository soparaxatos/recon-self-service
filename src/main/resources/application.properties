# Application Name
spring.application.name=Recon-Self-Service

# Server Port
server.port=8080

# Database Configuration (H2 for demonstration, can be replaced with Oracle/MySQL)
spring.datasource.url=jdbc:h2:mem:recondb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Feign Configuration
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=30000

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML

# File Upload/Download Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.recon.selfservice=DEBUG
logging.level.org.springframework.web=INFO
logging.level.feign=DEBUG
